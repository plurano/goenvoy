# Why: Pinned cosign and Syft installation shared by release and contract workflows.
name: Install release tools
description: Install pinned cosign and Syft binaries for signing and SBOM generation.
runs:
  using: composite
  steps:
    - name: Install pinned cosign
      uses: sigstore/cosign-installer@881c63bd87e38389154debd8331404ce7ca8a3ab # v4.1.4
      with:
        cosign-release: v3.1.5

    - name: Install pinned Syft
      uses: anchore/sbom-action/download-syft@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
      with:
        syft-version: v1.54.1

    - name: Verify the installed versions match the pins
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/verify-versions.sh"
